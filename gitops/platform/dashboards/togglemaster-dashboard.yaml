# como ler: ConfigMap com o JSON de um dashboard. O sidecar do Grafana procura ConfigMaps com o label [grafana_dashboard: "1"] no namespace [observability] e carrega o JSON da chave [togglemaster.json]
apiVersion: v1
kind: ConfigMap
metadata:
  name: togglemaster-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  togglemaster.json: |
    {
      "uid": "togglemaster",
      "title": "ToggleMaster · Visão geral",
      "tags": [
        "togglemaster",
        "fase4"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "editable": true,
      "templating": {
        "list": [
          {
            "name": "busca",
            "label": "busca nos logs",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Cluster: uso de recursos",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU por nó (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "{{instance}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "node-exporter: quanto da CPU de cada nó está ocupada.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memória por nó (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{instance}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "node-exporter: memória usada em cada nó.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "CPU por pod · togglemaster",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"togglemaster\", container!=\"\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "cAdvisor (kubelet): núcleos de CPU usados por pod.",
          "fieldConfig": {
            "defaults": {
              "unit": "cores"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Memória por pod · togglemaster",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"togglemaster\", container!=\"\"})",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "cAdvisor (kubelet): memória em uso por pod (a mesma que o limit compara).",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Tráfego dos serviços (métricas do OpenTelemetry)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Requisições por segundo, por serviço",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 16,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_server_request_duration_seconds_count[1m])) or sum by (job) (rate(http_server_duration_milliseconds_count[1m]))",
              "legendFormat": "{{job}}",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Métrica HTTP enviada pelos serviços via OTel Collector -> Prometheus. job = OTEL_SERVICE_NAME.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Erros 5xx do auth (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 18,
            "w": 8,
            "h": 8
          },
          "targets": [
            {
              "expr": "100 * (sum(rate(http_server_request_duration_seconds_count{job=\"auth-service\", http_response_status_code=~\"5..\"}[5m])) or sum(rate(http_server_duration_milliseconds_count{job=\"auth-service\", http_status_code=~\"5..\"}[5m]))) / (sum(rate(http_server_request_duration_seconds_count{job=\"auth-service\"}[5m])) or sum(rate(http_server_duration_milliseconds_count{job=\"auth-service\"}[5m])))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "description": "Mesma conta da regra de alerta: acima de 5% fica vermelho.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Logs ao vivo (Loki)",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 10,
          "type": "logs",
          "title": "Logs · namespace togglemaster",
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "gridPos": {
            "x": 0,
            "y": 27,
            "w": 24,
            "h": 12
          },
          "targets": [
            {
              "expr": "{k8s_namespace_name=\"togglemaster\"} |~ \"(?i)$busca\"",
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              }
            }
          ],
          "description": "Logs lidos pelo Collector (filelog) e enviados ao Loki. Use a caixa 'busca' no topo para filtrar.",
          "options": {
            "showTime": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        }
      ]
    }
