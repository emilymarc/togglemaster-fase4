# como ler: values do chart kube-prometheus-stack. Cada bloco [alertmanager], [prometheus], [grafana] liga, desliga ou ajusta uma parte do chart
alertmanager:
  enabled: false # no grafana

prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true   # aceita as métricas que o Collector empurra
    retention: 2d

grafana:
  additionalDataSources:
    - name: Loki
      uid: loki                       # o dashboard procura o Loki por este id
      type: loki
      url: http://loki-gateway.observability.svc.cluster.local