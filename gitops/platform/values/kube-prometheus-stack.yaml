# como ler: values do chart kube-prometheus-stack. Cada bloco [alertmanager], [prometheus], [grafana] liga, desliga ou ajusta uma parte do chart
alertmanager:
  enabled: false                    # os alertas são feitos pelo Grafana

prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true   # aceita as métricas que o Collector empurra
    retention: 2d
    resources:
      requests:
        memory: 400Mi

grafana:
  additionalDataSources:
    - name: Loki
      uid: loki                       # o dashboard procura o Loki por este id
      type: loki
      url: http://loki-gateway.observability.svc.cluster.local
  # variáveis de ambiente usadas nos contact points (Secret criado no cluster, fora do Git)
  envFromSecrets:
    - name: grafana-alerting
      optional: true
  # alertas como código: o Grafana lê estes arquivos ao iniciar (provisioning)
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: togglemaster-oncall
          receivers:
            - uid: pagerduty-oncall
              type: pagerduty
              settings:
                integrationKey: ${PAGERDUTY_INTEGRATION_KEY}
                severity: critical
            - uid: discord-alertas
              type: discord
              settings:
                url: ${DISCORD_WEBHOOK_URL}
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: togglemaster-oncall
          group_by: [alertname, service]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: togglemaster
          folder: ToggleMaster
          interval: 1m
          rules:
            - uid: auth-5xx-rate
              title: "auth-service: erros 5xx acima de 5%"
              condition: acima_do_limite
              data:
                - refId: taxa_5xx
                  datasourceUid: prometheus
                  relativeTimeRange: { from: 300, to: 0 }
                  model:
                    refId: taxa_5xx
                    instant: true
                    expr: |
                      100 * (
                        sum(rate(http_server_request_duration_seconds_count{job="auth-service", http_response_status_code=~"5.."}[5m]))
                        or sum(rate(http_server_duration_milliseconds_count{job="auth-service", http_status_code=~"5.."}[5m]))
                      ) / (
                        sum(rate(http_server_request_duration_seconds_count{job="auth-service"}[5m]))
                        or sum(rate(http_server_duration_milliseconds_count{job="auth-service"}[5m]))
                      )
                - refId: acima_do_limite    # a decisão: taxa_5xx > 5
                  datasourceUid: __expr__     # calculado pelo próprio Grafana (Expressions)
                  model:
                    refId: acima_do_limite
                    type: threshold
                    expression: taxa_5xx
                    conditions:
                      - evaluator: { type: gt, params: [5] }
              for: 2m                         # precisa ficar acima de 5% por 2 minutos seguidos
              noDataState: OK                 # sem tráfego não é incidente
              execErrState: Error
              labels:
                severity: critical
                service: auth
              annotations:
                # {{` `}} impede o Helm de ler o template; $$ impede o Grafana de trocar $values por variável de ambiente
                summary: '{{`{{ printf "%.1f" $$values.taxa_5xx.Value }}`}}% de respostas 5xx no auth-service'
                description: "Mais de 5% das requisições do auth-service retornaram erro 5xx nos últimos 5 minutos."