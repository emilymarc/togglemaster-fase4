apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: 982599766065.dkr.ecr.us-east-1.amazonaws.com/togglemaster-auth:6de1a8e
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: AUTH_DATABASE_URL
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: MASTER_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: togglemaster
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001
