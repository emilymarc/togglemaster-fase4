# como ler: Deployment [name] roda a imagem [image] com as variáveis [env]; o Service [name] expõe a porta [port] dentro do cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation
  template:
    metadata:
      labels:
        app: evaluation
    spec:
      containers:
        - name: evaluation
          image: 982599766065.dkr.ecr.us-east-1.amazonaws.com/togglemaster-evaluation:1d1837c
          ports:
            - containerPort: 8004
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: REDIS_URL
            - name: FLAG_SERVICE_URL
              value: "http://flag:8002"
            - name: TARGETING_SERVICE_URL
              value: "http://targeting:8003"
            - name: SERVICE_API_KEY        # chave criada no auth-service (POST /admin/keys)
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: SERVICE_API_KEY
                  optional: true           # o pod sobe mesmo sem a chave no Secret
            - name: AWS_SQS_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: SQS_QUEUE_URL
            - name: AWS_REGION
              value: "us-east-1"
            # OpenTelemetry: nome do serviço e endereço do Collector
            - name: OTEL_SERVICE_NAME
              value: evaluation-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.observability.svc.cluster.local:4317
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation
  namespace: togglemaster
spec:
  selector:
    app: evaluation
  ports:
    - port: 8004
      targetPort: 8004
