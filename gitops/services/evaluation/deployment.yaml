apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation
  template:
    metadata:
      labels:
        app: evaluation
    spec:
      containers:
        - name: evaluation
          image: 982599766065.dkr.ecr.us-east-1.amazonaws.com/togglemaster-evaluation:1d1837c
          ports:
            - containerPort: 8004
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: REDIS_URL
            - name: FLAG_SERVICE_URL
              value: "http://flag:8002"
            - name: TARGETING_SERVICE_URL
              value: "http://targeting:8003"
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: MASTER_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: evaluation
  namespace: togglemaster
spec:
  selector:
    app: evaluation
  ports:
    - port: 8004
      targetPort: 8004
