apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting
  template:
    metadata:
      labels:
        app: targeting
    spec:
      containers:
        - name: targeting
          image: 982599766065.dkr.ecr.us-east-1.amazonaws.com/togglemaster-targeting:6ec6c62
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: TARGETING_DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: targeting
  namespace: togglemaster
spec:
  selector:
    app: targeting
  ports:
    - port: 8003
      targetPort: 8003
