# como ler: Deployment [name] roda a imagem [image] com as variáveis [env]; o Service [name] expõe a porta [port] dentro do cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: targeting
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: targeting
  template:
    metadata:
      labels:
        app: targeting
    spec:
      containers:
        - name: targeting
          image: 982599766065.dkr.ecr.us-east-1.amazonaws.com/togglemaster-targeting:6ec6c62
          ports:
            - containerPort: 8003
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: TARGETING_DATABASE_URL
            - name: AUTH_SERVICE_URL       # o código encerra na inicialização sem esta variável
              value: "http://auth:8001"
            # OpenTelemetry: nome do serviço, endereço do Collector e tipos de dado enviados
            - name: OTEL_SERVICE_NAME
              value: targeting-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://opentelemetry-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: none                 # os logs já chegam ao Loki pelo filelog do Collector
---
apiVersion: v1
kind: Service
metadata:
  name: targeting
  namespace: togglemaster
spec:
  selector:
    app: targeting
  ports:
    - port: 8003
      targetPort: 8003
