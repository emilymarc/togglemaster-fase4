apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag
  namespace: togglemaster
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
        - name: flag
          image: 982599766065.dkr.ecr.us-east-1.amazonaws.com/togglemaster-flag:8cae9c4
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: togglemaster-secrets
                  key: FLAG_DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: flag
  namespace: togglemaster
spec:
  selector:
    app: flag
  ports:
    - port: 8002
      targetPort: 8002
