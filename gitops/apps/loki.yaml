# como ler: ArgoCD instale [repoURL] em [destination]. Use [values] como descrição de como a instalação deve ser, o arquivo de detalhes está em [valuesFiles]

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: hhttps://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.5.0
      helm:
        valueFiles:
          - $values/gitops/platform/values/loki.yaml
    - repoURL: https://github.com/emilymarc/togglemaster-fase4
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
