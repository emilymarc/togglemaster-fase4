name: flag-service

on:
  push:
    branches: [main]
    paths:
      - 'services/flag/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/flag/**'
      - '.github/workflows/python-ci.yml'

jobs:
  ci:
    uses: ./.github/workflows/python-ci.yml
    with:
      service_dir: flag
      service_name: flag-service
    secrets: inherit
