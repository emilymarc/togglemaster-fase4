name: secret-scan

# Roda no repositorio inteiro (infra, gitops, scripts, services) a cada push e PR.
# Os pipelines por servico so varrem services/<svc> e so quando aquele servico muda.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — segredos no repositorio (qualquer achado bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_SECRET_CONFIG: trivy-secret.yaml
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          exit-code: '1'
