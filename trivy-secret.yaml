# Regras extras de segredo para o Trivy (carregado automaticamente da raiz).
# As regras nativas (AWS, GitHub, Slack, chaves privadas...) continuam ativas;
# estas cobrem as credenciais novas da Fase 4.
rules:
  - id: newrelic-license-key
    category: NewRelic
    title: New Relic License (ingest) Key
    severity: CRITICAL
    regex: '\b[A-Fa-f0-9]{36}NRAL\b'
    keywords:
      - NRAL

  - id: discord-webhook-url
    category: Discord
    title: Discord Webhook URL
    severity: CRITICAL
    regex: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_-]{60,}'
    keywords:
      - discord

  - id: pagerduty-integration-key
    category: PagerDuty
    title: PagerDuty Events API v2 integration (routing) key
    severity: CRITICAL
    regex: '(?i)(?:routing_key|integration_key|pagerduty_key)["'']?\s*[:=]\s*["'']?[A-Za-z0-9]{32}\b'
    keywords:
      - routing_key
      - integration_key
      - pagerduty_key
